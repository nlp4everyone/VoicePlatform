name: CI

on:
  push:
    branches: [ray/nvidia_asr]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # torchcodec needs the FFmpeg shared libraries, python-magic needs libmagic
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libmagic1

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: tests/requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU torch only; NeMo is faked in tests/conftest.py, so no GPU or model is needed
      - name: Install test dependencies
        run: |
          uv venv --python 3.11
          uv pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -r tests/requirements.txt

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Test
        run: .venv/bin/python -m pytest
