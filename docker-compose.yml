services:
  voxcpm2-tts:
    build: .
    image: voxcpm2-tts:v0.26.0
    container_name: voxcpm2-tts-serve
    command: >
      vllm serve ${MODEL_NAME:-openbmb/VoxCPM2}
      --omni
      --trust-remote-code
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.75}
      --host ${VLLM_HOST:-0.0.0.0}
      --port 8002
      --download-dir /root/.cache/huggingface/hub
      --max-model-len ${MAX_MODEL_LEN:-2048}
      --max-num-seqs ${MAX_NUM_SEQS:-4}
      --quantization ${QUANTIZATION:-fp8}
      --stage-overrides '{"0": {"kv_cache_memory_bytes": ${KV_CACHE_BYTES:-2147483648}, "max_model_len": ${MAX_MODEL_LEN:-2048}, "max_num_seqs": ${MAX_NUM_SEQS:-4}}}'
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "${VLLM_PORT:-8002}:8002"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface/hub}:/root/.cache/huggingface/hub
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
