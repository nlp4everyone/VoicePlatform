services:
  # One-shot job: Fun-ASR-MLT-Nano-2512 only ships a native FunASR checkpoint, so convert it
  # into a vLLM model directory (skipped once ./models already holds the converted model)
  fun-asr-convert:
    build: .
    image: fun-asr-vllm:audio
    entrypoint: ["python3", "/scripts/convert_mlt_to_vllm.py", "/models/Fun-ASR-MLT-Nano-2512-vllm"]
    volumes:
      - ./scripts:/scripts:ro
      - ./models:/models
      - ${HF_CACHE_DIR:-~/.cache/huggingface/hub}:/root/.cache/huggingface/hub
    environment:
      - HF_HOME=/root/.cache/huggingface

  fun-asr-mlt:
    image: fun-asr-vllm:audio
    container_name: fun-asr-mlt-nano
    depends_on:
      fun-asr-convert:
        condition: service_completed_successfully
    command:
      - "/models/Fun-ASR-MLT-Nano-2512-vllm"
      - "--served-model-name"
      - "fun-asr-mlt-nano"
      # float32 is the precision FunAudioLLM validated for transcription fidelity
      - "--dtype"
      - "float32"
      - "--gpu-memory-utilization"
      - "0.7"
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8002"
    ports:
      - "${VLLM_PORT:-8002}:8002"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
