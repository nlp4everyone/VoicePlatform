services:
  qwen-asr:
    build: .
    image: qwen-asr:v0.24.0
    container_name: qwen-asr-serve
    command:
      - ${MODEL_NAME:-Qwen/Qwen3-ASR-1.7B}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.8}
      - --host=${VLLM_HOST:-0.0.0.0}
      - --port=${VLLM_PORT:-8001}
      - --download-dir=${DOWNLOAD_DIR:-/root/.cache/huggingface/hub}
      - --max-model-len=${MAX_MODEL_LEN:-8192}
      - --max-num-seqs=${MAX_NUM_SEQS:-4}
      # Qwen3-ASR's realtime architecture is not auto-detected from config.json; without
      # this override the /v1/realtime WebSocket route is never mounted (handshake -> 403).
      - '--hf-overrides={"architectures":["Qwen3ASRRealtimeGeneration"]}'
    ports:
      - "${VLLM_PORT:-8001}:${VLLM_PORT:-8001}"
    volumes:
      - vllm-cache:${DOWNLOAD_DIR:-/root/.cache/huggingface/hub}
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    environment:
      - TRANSFORMERS_VERBOSITY=error
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
volumes:
  vllm-cache: